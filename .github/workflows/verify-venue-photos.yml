name: Verify published venue photos
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/photos/**'
      - 'scripts/validate-venue-photos.py'
      - '.github/workflows/verify-venue-photos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image verification dependency
        run: python -m pip install Pillow
      - name: Validate currently displayed licensed venue photos
        run: python scripts/validate-venue-photos.py
