name: Verify published venue photos
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/atelier-catalog.js'
      - 'assets/atelier-sources.js'
      - 'assets/atelier-media.js'
      - 'audits/stage01-original-data-snapshot.json'
      - 'tests/atelier-source-registry.cjs'
      - 'assets/photos/**'
      - 'scripts/validate-venue-photos.py'
      - '.github/workflows/verify-venue-photos.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image verification dependency
        run: python -m pip install Pillow
      - name: Check published page JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, re.S)
          if len(scripts) != 1 or not scripts[0].strip():
              raise SystemExit(f"Expected one nonempty inline script, got {len(scripts)}")
          pathlib.Path("/tmp/atelier-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/atelier-inline.js
          node tests/check-inline-js.cjs
      - name: Validate currently displayed licensed venue photos
        id: photo_validation
        run: |
          python scripts/validate-venue-photos.py 2>&1 | tee venue-photo-audit.log
          exit ${PIPESTATUS[0]}
      - name: Publish validation summary
        if: always()
        run: |
          echo "## Tokyo Concierge Atelier · Venue photo audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation outcome: ${{ steps.photo_validation.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          if [ -f venue-photo-audit.log ]; then cat venue-photo-audit.log >> "$GITHUB_STEP_SUMMARY"; else echo "Validation did not start." >> "$GITHUB_STEP_SUMMARY"; fi
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload photo audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venue-photo-audit
          path: venue-photo-audit.log
          if-no-files-found: ignore

      - name: Diagnose GitHub Pages deployment
        if: always()
        env:
          GH_PAGES_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_ROOT: ${{ github.api_url }}
        run: |
          echo "## GitHub Pages diagnostics" >> "$GITHUB_STEP_SUMMARY"
          api_code=$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/pages-status.json" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_PAGES_TOKEN" \
            "$API_ROOT/repos/$REPOSITORY/pages") || api_code="000"
          echo "Pages configuration API HTTP: $api_code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$api_code" = "200" ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pages-status.json").read_text())
          src = p.get("source") or {}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"Build type: {p.get('build_type', 'unknown')}\n\n")
              out.write(f"Source: {src.get('branch', 'not returned')} {src.get('path', '')}\n\n")
              out.write(f"Pages status: {p.get('status', 'unknown')}\n\n")
              out.write(f"Configured URL: {p.get('html_url', 'not returned')}\n\n")
          PY
          else
            echo "::warning::Cannot verify GitHub Pages configuration (HTTP $api_code). Check Settings > Pages."
          fi
          owner="${REPOSITORY%/*}"
          project="${REPOSITORY#*/}"
          site="https://${owner}.github.io/${project}/"
          http_code=$(curl --silent --show-error --location --max-time 25 \
            --output "$RUNNER_TEMP/pages-home.html" --write-out '%{http_code}' "$site") || http_code="000"
          echo "Expected published URL: $site" >> "$GITHUB_STEP_SUMMARY"
          echo "Public site HTTP: $http_code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$http_code" = "200" ]; then
            local_sha=$(sha256sum index.html | cut -d' ' -f1)
            remote_sha=$(sha256sum "$RUNNER_TEMP/pages-home.html" | cut -d' ' -f1)
            echo "Checked commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "Source index SHA256: $local_sha" >> "$GITHUB_STEP_SUMMARY"
            echo "Published index SHA256: $remote_sha" >> "$GITHUB_STEP_SUMMARY"
            if [ "$local_sha" = "$remote_sha" ]; then
              echo "Published content matches checked source: YES" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Published content matches checked source: NO / may be transformed or stale" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Pages index differs from checked source; check publishing branch, deployment age and possible Jekyll processing."
            fi
          fi
          if [ "$http_code" = "200" ] && grep -q 'Tokyo Concierge Atelier' "$RUNNER_TEMP/pages-home.html"; then
            echo "Public content check: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Public content check: NOT VERIFIED (publishing may be delayed or Pages may be disabled)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Published site not verified: HTTP $http_code at $site"
          fi
