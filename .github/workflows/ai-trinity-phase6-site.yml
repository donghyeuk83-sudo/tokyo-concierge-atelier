name: AI Trinity Phase 6 (free Draft site-link regression)

on:
  pull_request:
    branches:
      - 'feat/ai-trinity-manual-review-zero-cost-20261023'
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ai-trinity-phase6-site.yml'
      - 'index.html'
      - 'docs/ai-trinity-manual-preview.html'
      - 'scripts/ai-trinity-manual.js'
      - 'scripts/ai-trinity-preview-i18n.js'
      - 'tests/ai-trinity-phase6.cjs'
      - 'tests/ai-trinity-phase6-browser.cjs'

permissions:
  contents: read

concurrency:
  group: ai-trinity-phase6-site-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-privacy-and-integrity:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/ai-trinity-site-link-i18n-20261024' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'feat/ai-trinity-manual-review-zero-cost-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Phase 1–6 no-API and privacy regression
        run: node --test tests/ai-trinity-preflight.cjs tests/ai-trinity-router.cjs tests/ai-trinity-offline-adapters.cjs tests/ai-trinity-connection-preflight.cjs tests/ai-trinity-orchestrator.cjs tests/ai-trinity-manual.cjs tests/ai-trinity-phase6.cjs
      - name: Site 17-script policy and localized preview syntax
        run: |
          node tests/check-inline-js.cjs
          node --check scripts/ai-trinity-manual.js
          node --check scripts/ai-trinity-preview-i18n.js

  browser-site-and-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/ai-trinity-site-link-i18n-20261024' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'feat/ai-trinity-manual-review-zero-cost-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      AI_TRINITY_TEST_BROWSER: ${{ matrix.engine }}
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '45000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated Playwright without AI packages
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Install the selected browser only
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify standalone manual preview and its safety controls
        run: node tests/ai-trinity-manual-browser.cjs
      - name: Verify EN/JA/KO, privacy, site link and iPhone/desktop UX
        run: node tests/ai-trinity-phase6-browser.cjs
      - name: Existing Chromium catalogue and shortlist regression
        if: matrix.engine == 'chromium'
        run: |
          node tests/smoke.cjs
          node tests/state-regression.cjs
      - name: Existing WebKit iPhone UX and CSV regression
        if: matrix.engine == 'webkit'
        run: node tests/webkit-mobile.cjs
