name: Venue photo discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '25 1 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Research Wikimedia Commons candidates for all 131 venues
        run: node tests/find-commons-photos.cjs
      - name: Save research reports
        uses: actions/upload-artifact@v4
        with:
          name: commons-photo-candidates-131
          path: audits/commons-photo-candidates.*
          retention-days: 30
