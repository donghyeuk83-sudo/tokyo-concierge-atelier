name: Venue photo discovery
on:
  workflow_dispatch:
  # Respect Wikimedia API backoff: one weekly check, never re-trigger on every code push.
  schedule:
    - cron: '25 1 * * 1'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Research Wikimedia Commons candidates for all 131 venues
        run: node tests/find-commons-photos.cjs
      - name: Save research reports
        uses: actions/upload-artifact@v6
        with:
          name: commons-photo-candidates-131
          path: audits/commons-photo-candidates.*
          retention-days: 30
