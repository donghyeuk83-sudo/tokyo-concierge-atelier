name: AI Trinity Phase 2 (offline simulator)

on:
  pull_request:
    branches:
      - 'feat/ai-trinity-dry-run-20261023'
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ai-trinity-phase2.yml'
      - 'config/ai-trinity-routing.json'
      - 'scripts/ai-trinity-router.mjs'
      - 'tests/ai-trinity-router.cjs'
      - 'docs/ai-trinity-phase2.md'

permissions:
  contents: read

concurrency:
  group: ai-trinity-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-self-test:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/ai-trinity-offline-router-20261023' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'feat/ai-trinity-dry-run-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test Phase 1 and Phase 2 safety gates
        run: node --test tests/ai-trinity-preflight.cjs tests/ai-trinity-router.cjs
      - name: Run synthetic offline demo only
        env:
          AI_TRINITY_PHASE2_OFFLINE: 'true'
        run: node scripts/ai-trinity-router.mjs --demo
