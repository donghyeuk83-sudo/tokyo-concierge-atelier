name: Browser smoke QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# A newer main push supersedes older Pages revisions. Avoid stale jobs racing deployment.
concurrency:
  group: atelier-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Ensure missing-photo queue is current
        run: |
          node tests/photo-queue.cjs
          git diff --exit-code -- audits/missing-photo-queue.csv
      - name: Audit permission inquiry routes for missing photos
        run: node tests/audit-photo-permission-queue.cjs
      - name: Audit 32 photo leads and 48 original image rightsholders
        run: node tests/audit-photo-rightsholder-research.cjs
      - name: Block unreviewed new or replaced real venue photos
        run: node tests/require-photo-clearance.cjs
      - name: Audit all 131 venue records and photo provenance
        run: node tests/audit-venues.cjs
      - name: Check reachability of 131 venue URLs
        run: node tests/check-venue-links.cjs
      - name: Upload venue photo audit
        uses: actions/upload-artifact@v4
        with:
          name: venue-photo-audit-131
          path: audits/
      - name: Test repository HTML in Chromium
        run: node tests/smoke.cjs
      - name: Regress shortlist, venue location and blocked storage
        run: node tests/state-regression.cjs
      - name: Test iPhone Safari-style WebKit mobile UX and CSV
        run: node tests/webkit-mobile.cjs
      - name: Audit all image-generation and research safety gates
        run: |
          node --check scripts/find-photo-candidates.mjs
          node --check tests/find-commons-photos.cjs
          node tests/audit-pipeline-safety.cjs
          python -m py_compile scripts/generate-venue-ai-images.py scripts/validate-venue-photos.py
      - name: Wait for current revision on GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages_ready
        env:
          LIVE_URL: https://donghyeuk83-sudo.github.io/tokyo-concierge-atelier/
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsSL --max-time 15 "$LIVE_URL" -o /tmp/atelier-live.html && cmp -s index.html /tmp/atelier-live.html; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo 'Public site has exact checked-out revision'
              exit 0
            fi
            # Old revisions must never block or test a newer public Pages revision.
            REMOTE_SHA="$(git ls-remote origin refs/heads/main 2>/dev/null | cut -f1)"
            if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo "::notice::Superseded by main $REMOTE_SHA; newer push runs its own browser QA"
              exit 0
            fi
            echo "Waiting for Pages revision $GITHUB_SHA: $attempt/60"
            sleep 10
          done
          echo "::error::Current Pages revision not published after 10 minutes; inspect GitHub Pages/Actions status"
          exit 1
      - name: Test deployed GitHub Pages in Chromium
        if: steps.pages_ready.outputs.ready == 'true'
        env:
          TEST_URL: https://donghyeuk83-sudo.github.io/tokyo-concierge-atelier/
        run: |
          node tests/smoke.cjs
          node tests/state-regression.cjs
          node tests/webkit-mobile.cjs
