name: Browser smoke QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Test live HTML in Chromium
        run: node tests/smoke.cjs
