name: AI Trinity Phase 3B (offline preflight gates)

on:
  pull_request:
    branches:
      - 'feat/ai-trinity-offline-adapters-20261023'
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ai-trinity-phase3b.yml'
      - 'config/ai-trinity-connection-policy.json'
      - 'scripts/ai-trinity-connection-preflight.mjs'
      - 'tests/ai-trinity-connection-preflight.cjs'
      - 'docs/ai-trinity-phase3b.md'

permissions:
  contents: read

concurrency:
  group: ai-trinity-phase3b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-preflight-test:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/ai-trinity-preflight-gates-20261023' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'feat/ai-trinity-offline-adapters-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: All 4 offline phases and privacy/cost/approval tests
        run: node --test tests/ai-trinity-preflight.cjs tests/ai-trinity-router.cjs tests/ai-trinity-offline-adapters.cjs tests/ai-trinity-connection-preflight.cjs
      - name: Synthetic preflight demo only
        env:
          AI_TRINITY_PHASE3B_OFFLINE: 'true'
        run: node scripts/ai-trinity-connection-preflight.mjs --demo
