name: Collect unverified venue photo candidates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/photo-candidate-research.yml'
      - 'scripts/find-photo-candidates.mjs'
      - 'audits/missing-photo-queue.csv'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find image candidates (research only)
        run: node scripts/find-photo-candidates.mjs
      - name: Upload candidate report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commons-photo-candidates
          path: audits/commons-photo-candidates.json
          if-no-files-found: warn
          retention-days: 14
