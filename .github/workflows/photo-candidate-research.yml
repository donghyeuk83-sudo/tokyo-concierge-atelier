name: Collect unverified venue photo candidates
# Avoid overlapping research runs competing for Wikimedia Commons API capacity.
concurrency:
  group: tokyo-concierge-commons-photo-research
  cancel-in-progress: true
on:
  # This candidate search can exhaust Commons API capacity; execute only on explicit request.
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check candidate discovery script syntax
        run: node --check scripts/find-photo-candidates.mjs
      - name: Find image candidates (research only)
        run: node scripts/find-photo-candidates.mjs
      - name: Upload candidate report for review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commons-photo-candidates
          path: audits/commons-photo-candidates.json
          if-no-files-found: warn
          retention-days: 14
