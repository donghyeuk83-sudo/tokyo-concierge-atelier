name: AI Trinity Phase 3A (offline adapters)

on:
  pull_request:
    branches:
      - 'feat/ai-trinity-offline-router-20261023'
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ai-trinity-phase3.yml'
      - 'config/ai-trinity-adapter-policy.json'
      - 'scripts/ai-trinity-offline-adapters.mjs'
      - 'tests/ai-trinity-offline-adapters.cjs'
      - 'docs/ai-trinity-phase3.md'

permissions:
  contents: read

concurrency:
  group: ai-trinity-phase3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-adapter-test:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/ai-trinity-offline-adapters-20261023' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'feat/ai-trinity-offline-router-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test every Phase 1, 2 and 3A safety gate
        run: node --test tests/ai-trinity-preflight.cjs tests/ai-trinity-router.cjs tests/ai-trinity-offline-adapters.cjs
      - name: Run local synthetic adapter demo
        env:
          AI_TRINITY_PHASE3_OFFLINE: 'true'
        run: node scripts/ai-trinity-offline-adapters.mjs --demo
