name: Generate unique venue AI photo concepts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-venue-ai-images.yml'
      - 'scripts/generate-venue-ai-images.py'
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - name: Fetch unique photorealistic AI images and map successful files
        run: python scripts/generate-venue-ai-images.py
      - name: Commit only valid generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A assets/photos/
          if ! git diff --cached --quiet; then
            git commit -m "Add uniquely generated AI sushi venue concept images"
            git push
          fi
