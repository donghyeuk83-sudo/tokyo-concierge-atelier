name: Generate venue AI concepts (manual review only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: venue-concept-review
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - name: Compile generation and photo audit
        run: python -m py_compile scripts/generate-venue-ai-images.py scripts/validate-venue-photos.py
      - name: Generate illustrative AI concepts for manual review only
        run: python scripts/generate-venue-ai-images.py
      - name: Validate images, file identity and design
        run: python scripts/validate-venue-photos.py
      - name: Upload draft image concepts without editing main or publishing
        uses: actions/upload-artifact@v4
        with:
          name: venue-ai-concepts-review-only
          path: |
            assets/photos/ai-unique-*.webp
            index.html
          retention-days: 7
