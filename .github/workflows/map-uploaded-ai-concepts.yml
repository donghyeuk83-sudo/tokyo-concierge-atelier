name: Review uploaded AI concepts (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Preview AI concept mapping (no commit)
        run: node scripts/map-uploaded-ai-concepts.cjs
      - name: Export proposed changes for manual PR review
        uses: actions/upload-artifact@v6
        with:
          name: atelier-concept-mapping-review
          path: assets/atelier-media.js
          retention-days: 7
