name: Apply uploaded AI photo concepts
on:
  push:
    branches: [main]
    paths:
      - 'assets/photos/*.webp'
      - 'scripts/map-uploaded-ai-concepts.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/map-uploaded-ai-concepts.cjs
      - name: Commit updated image links
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Apply uploaded venue-specific AI photo concepts"
            git push
          fi
