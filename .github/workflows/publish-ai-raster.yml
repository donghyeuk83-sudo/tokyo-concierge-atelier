name: Preview raster AI photo conversion (manual review only)
on:
  workflow_dispatch:
jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Extract embedded photographic raster (no vector conversion)
        run: |
          python3 - <<'PY'
          import base64, pathlib, re
          p=pathlib.Path('assets/photos/ai-sushi-concept.svg')
          m=re.search(r'data:image/webp;base64,([^"]+)',p.read_text())
          if not m:
              raise SystemExit('No embedded photo in SVG')
          out=pathlib.Path('assets/photos/ai-sushi-concept.webp')
          out.write_bytes(base64.b64decode(m.group(1)))
          print(f'Wrote {out}: {out.stat().st_size} bytes')
          PY
      - name: Update venue image to raster path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/atelier-media.js')
          s=p.read_text()
          old="assets/photos/ai-sushi-concept.svg"
          new="assets/photos/ai-sushi-concept.webp"
          if old not in s and new not in s:
              raise SystemExit('AI sushi reference missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Upload raster conversion for review without modifying main
        uses: actions/upload-artifact@v6
        with:
          name: ai-raster-review-only
          path: |
            assets/photos/ai-sushi-concept.webp
            assets/atelier-media.js
          retention-days: 7
