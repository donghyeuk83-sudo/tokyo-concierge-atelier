name: Publish raster AI photo assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-ai-raster.yml'
      - 'assets/photos/ai-sushi-concept.svg'
jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract embedded photographic raster (no vector conversion)
        run: |
          python3 - <<'PY'
          import base64, pathlib, re
          p=pathlib.Path('assets/photos/ai-sushi-concept.svg')
          m=re.search(r'data:image/webp;base64,([^"]+)',p.read_text())
          if not m:
              raise SystemExit('No embedded photo in SVG')
          out=pathlib.Path('assets/photos/ai-sushi-concept.webp')
          out.write_bytes(base64.b64decode(m.group(1)))
          print(f'Wrote {out}: {out.stat().st_size} bytes')
          PY
      - name: Update venue image to raster path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="assets/photos/ai-sushi-concept.svg"
          new="assets/photos/ai-sushi-concept.webp"
          if old not in s and new not in s:
              raise SystemExit('AI sushi reference missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit image and reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/photos/ai-sushi-concept.webp
          if ! git diff --cached --quiet; then
            git commit -m "Use embedded AI photo raster instead of SVG for sushi card"
            git push
          fi
